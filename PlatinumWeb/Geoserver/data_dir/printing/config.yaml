#===========================================================================
# allowed DPIs
#===========================================================================
dpis: [96, 150, 200, 254]
#===========================================================================
# the allowed scales
#===========================================================================
scales:
  - 533
  - 1066
  - 2132
  - 4265
  - 8530
  - 17061
  - 34123
  - 68247
  - 136494
  - 272988
  - 545977
  - 1091955
  - 2183910
  - 4367821
#===========================================================================
# the list of allowed hosts
#===========================================================================
hosts:
  - !localMatch
    dummy: true
  - !ipMatch
    ip:0.0.0.0
    mask:0.0.0.0
  - !dnsMatch
    host: 0.0.0.0
  - !dnsMatch
    host: maps.google.com

#===========================================================================
# allowed Formats '*' means any formats
#===========================================================================
formats: ['pdf', 'png', 'tiff']

outputFilename: 'MAP_${yyyy-MM-dd}_T${HHmmss}'

#These two settings let the print server open lots of connections to the source dataset.
globalParallelFetches: 10
perHostParallelFetches: 10
tilecacheMerging: true

#Connection timeouts for connecting to the map servers in ms
connectionTimeout: 60000           
socketTimeout: 360000    
printTimeoutMinutes: 20
             
disableScaleLocking: false
brokenUrlPlaceholder: http://localhost:8090/geoserver/www/transparent.gif

layouts:		
  A4 Portrait:
  #===========================================================================
    metaData:
      title:    'MAP'
      author:   'Instituti i Modelimeve ne Business'
      subject:  'A4 Portrait: 595 x 842'
      keywords: 'Map,Print'
      creator:  'Denisa IMB'
      supportLegacyReader: false
    #-------------------------------------------------------------------------	
    mainPage:
      pageSize: A4 
      rotation: true  
      items:
        # The Map
        - !map
          absoluteX: 6
          absoluteY: 836
          width: 583
          height: 830
        #The map border
        - !columns
          config:
            borderWidth: 1
          absoluteX: 6
          absoluteY: 836
          width: 583
          items:
            - !text
              text: ''
			  
        # MAP Logo
        - !columns
          absoluteX: 11
          absoluteY: 831
          width: 35
          config:
            borderWidth: 1
          items:
            - !image
              maxWidth: 35
              maxHeight: 35
              align: left
              vertAlign: middle
              url: '${logoNdermarrjeUrl}'
              condition: vendosLogoPrintim				  
        #Title Box 
        - !columns
          absoluteX: 191
          absoluteY: 831
          width: 200	           		  
          items:
            - !text
              text: '${mapTitle}'
              spacingAfter: 18
              align: center
              fontSize: 16	
              fontColor: #FFFFFF	
              condition: mapTitle	
        - !columns
          absoluteX: 190.5
          absoluteY: 830.5
          width: 200	           		  
          items:
            - !text
              text: '${mapTitle}'
              spacingAfter: 18
              align: center
              fontSize: 16		
              condition: mapTitle	
			  
        ##North Arrow
        - !columns
          absoluteX: 544
          absoluteY: 831
          width: 40 
          items:		  
            - !image			
              maxWidth: 40
              maxHeight: 40
              align: left
              vertAlign: bottom	  
              url:  '${projectUrl}Geoserver/www/Default/Nord.png'
              rotation: '${rotation}' 			  
        #ScaleBar	    
        - !columns
          absoluteX: 544
          absoluteY: 785
          width: 70
          items:
            - !scalebar		
              maxSize: 60	
              type: bar
              fontSize: 5
              align: left
			  
        #Date Box	     
        - !columns
          absoluteX: 544
          absoluteY: 12
          width: 70			  
          items:		  
            - !text
              font: Helvetica
              fontSize: 4.8
              align: left
              text: '${now yyyy-MM-dd HH:mm:ss}'   				  		  

			  
    lastPage:
      pageSize: A4
      items:		
        #Legend   
        - !columns
          absoluteX: 21
          absoluteY: 800
          width: 250	       
          items:		  
            - !text
              font: Helvetica
              fontSize: 16
              align: left
              text: 'Shpjegues (Legend)'
              condition: legends
        - !columns
          condition: legends
          absoluteX: 21
          absoluteY: 770
          width: 250
          config:
            borderWidth: 2
            cells:
              - borderWidth: 1
                borderColor: black
                padding: 10
          items:		  
            - !legends
              iconMaxWidth: 130
              iconMaxHeight: 130
              defaultScale: 1.0
              maxWidth: 230
              #Padding between layers
              layerSpace: 6
              layerFont: Helvetica
              layerFontSize: 12
              #Padding between text and icon within layer
              classSpace: 2
              classIndentation: 15
              classFont: Helvetica
              classFontSize: 6
              backgroundColor: white
              inline:true	
			  
        #Contact details	  	  
        - !columns
          absoluteX: 350
          absoluteY: 800
          width: 230
          items:	
            - !text
              font: Helvetica
              fontSize: 8
              align: right
              text: ""		

